name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version & Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Build & Archive Project
        run: |
          xcodebuild -project LiquidReader/LiquidReader.xcodeproj \
            -scheme LiquidReader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LiquidReader.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/LiquidReader.xcarchive/Products/Applications/LiquidReader.app build/Payload/
          cd build
          zip -r -y LiquidReader-unsigned.ipa Payload
          ls -lh LiquidReader-unsigned.ipa
          cd ..

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidReader-unsigned-ipa
          path: build/LiquidReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
